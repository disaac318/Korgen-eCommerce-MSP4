{% extends "base.html" %}

{% block content %}

<!-- Main content -->
<main class=" bg-opacity-10 bg-warning"
     style="min-height: 40vh;">
     <div class="container">
          <div class="row justify-content-center">
               <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4 mt-5">

                    <section class="card shadow-sm">
                         <div class="card-body p-4">
                              <header class="mb-3">
                                   <h1 class="h4 mb-1fw-bold">Sign in</h1>
                                   <p class="text-muted small mb-0">Access your account to continue.</p>
                              </header>

                              <form action="#"
                                   method="post"
                                   aria-label="Sign in form">
                                   <div class="mb-3">
                                        <label for="email"
                                             class="form-label">Email address</label>
                                        <input id="email"
                                             name="email"
                                             type="email"
                                             class="form-control"
                                             autocomplete="email"
                                             required>
                                   </div>

                                   <div class="mb-2">
                                        <label for="password"
                                             class="form-label">Password</label>
                                        <input id="password"
                                             name="password"
                                             type="password"
                                             class="form-control"
                                             autocomplete="current-password"
                                             required>
                                   </div>

                                   <div class="d-flex justify-content-between align-items-center mb-3">
                                        <div class="form-check">
                                             <input class="form-check-input"
                                                  type="checkbox"
                                                  value="1"
                                                  id="rememberMe"
                                                  name="remember">
                                             <label class="form-check-label"
                                                  for="rememberMe">
                                                  Remember me
                                             </label>
                                        </div>

                                        <a href="#"
                                             class="small text-decoration-none">Forgot password?</a>
                                   </div>

                                   <button type="submit"
                                        class="btn btn-warning w-100">Login</button>
                              </form>
                         </div>
                    </section>

                    <p class="text-center mt-3 mb-5">
                         Don’t have an account? <a href="{% url 'accounts:register' %}"
                              class="text-decoration-none">Sign up</a>
                    </p>

               </div>
          </div>
     </div>
</main>

<!-- ========== Main content ends ========== -->

{% endblock %}
