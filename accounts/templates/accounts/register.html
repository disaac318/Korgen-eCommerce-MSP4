{% extends "base.html" %}

{% block content %}

<!-- ========== Main content starts ========== -->
<main class="bg-opacity-25 bg-warning "
     style="min-height: 75vh;">
     <div class="container">
          <div class="row justify-content-center">
               <div class="col-12 col-md-10 col-lg-8 col-xl-6 mt-5">

                    <section class="card shadow-sm mb-5">
                         <div class="card-body p-4">
                              <header class="mb-3">
                                   <h1 class="h4 mb-1">Sign up</h1>
                                   <p class="text-muted small mb-5 border-bottom">Create your account to start
                                        shopping.</p>
                              </header>

                              <form action="{% url 'accounts:register' %}"
                                   method="post"
                                   aria-label="Registration form">

                                   {% csrf_token %}

                                   <div class="row g-3">
                                        <div class="col-md-6">
                                             <label for="{{ form.first_name.id_for_label }}"
                                                  class="form-label">First name</label>
                                             {{ form.first_name }}
                                        </div>

                                        <div class="col-md-6">
                                             <label for="{{ form.last_name.id_for_label }}"
                                                  class="form-label">Last name</label>
                                             {{ form.last_name }}
                                        </div>
                                   </div>

                                   <!-- <div class="mt-3">
                                        <label for="{{ form.username.id_for_label }}"
                                             class="form-label">Username</label>
                                        {{ form.username }}
                                   </div> -->

                                   <div class="mt-3">
                                        <label for="{{ form.email.id_for_label }}"
                                             class="form-label">Email</label>
                                        {{ form.email }}
                                        <!-- <div class="form-text text-muted">We’ll never share your email with
                                             anyone else.
                                        </div> -->

                                   </div>

                                   <div class="row g-3 mt-1">
                                        <div class="col-md-6">
                                             <label for="{{ form.password.id_for_label }}"
                                                  class="form-label">Create password</label>
                                             {{ form.password }}
                                        </div>

                                        <div class="col-md-6">
                                             <label for="{{ form.password_confirm.id_for_label }}"
                                                  class="form-label">Repeat password</label>
                                             {{ form.password_confirm }}
                                        </div>
                                   </div>

                                   <div class="mt-3">
                                        <label for="{{ form.phone_number.id_for_label }}"
                                             class="form-label">Phone number</label>
                                        {{ form.phone_number }}
                                   </div>

                                   <!-- Shipping address -->
                                   <div class="row g-3 mt-1">
                                        <div class="col-12">
                                             <label for="address1"
                                                  class="form-label lead fw-bold">Shipping address</label>
                                             <input id="address1"
                                                  name="address1"
                                                  type="text"
                                                  class="form-control"
                                                  autocomplete="street-address"
                                                  placeholder="House number and street name"
                                                  required>
                                        </div>

                                   </div>

                                   <div class="row g-3 mt-1">
                                        <div class="col-md-6">
                                             <label for="city"
                                                  class="form-label">Town / City</label>
                                             <input id="city"
                                                  name="city"
                                                  type="text"
                                                  class="form-control"
                                                  autocomplete="address-level2"
                                                  required>
                                        </div>

                                        <div class="col-md-6">
                                             <label for="county"
                                                  class="form-label">County</label>
                                             <select id="county"
                                                  name="county"
                                                  class="form-select"
                                                  autocomplete="address-level1"
                                                  required>
                                                  <option value=""
                                                       selected>Choose…</option>
                                                  <option>Bedfordshire</option>
                                                  <option>Berkshire</option>
                                                  <option>Bristol</option>
                                                  <option>Buckinghamshire</option>
                                                  <option>Cambridgeshire</option>
                                                  <option>Cheshire</option>
                                                  <option>City of London</option>
                                                  <option>Cornwall</option>
                                                  <option>Cumbria</option>
                                                  <option>Derbyshire</option>
                                                  <option>Devon</option>
                                                  <option>Dorset</option>
                                                  <option>Durham</option>
                                                  <option>East Riding of Yorkshire</option>
                                                  <option>East Sussex</option>
                                                  <option>Essex</option>
                                                  <option>Gloucestershire</option>
                                                  <option>Greater London</option>
                                                  <option>Greater Manchester</option>
                                                  <option>Hampshire</option>
                                                  <option>Herefordshire</option>
                                                  <option>Hertfordshire</option>
                                                  <option>Isle of Wight</option>
                                                  <option>Kent</option>
                                                  <option>Lancashire</option>
                                                  <option>Leicestershire</option>
                                                  <option>Lincolnshire</option>
                                                  <option>Merseyside</option>
                                                  <option>Norfolk</option>
                                                  <option>North Yorkshire</option>
                                                  <option>Northamptonshire</option>
                                                  <option>Northumberland</option>
                                                  <option>Nottinghamshire</option>
                                                  <option>Oxfordshire</option>
                                                  <option>Rutland</option>
                                                  <option>Shropshire</option>
                                                  <option>Somerset</option>
                                                  <option>South Yorkshire</option>
                                                  <option>Staffordshire</option>
                                                  <option>Suffolk</option>
                                                  <option>Surrey</option>
                                                  <option>Tyne and Wear</option>
                                                  <option>Warwickshire</option>
                                                  <option>West Midlands</option>
                                                  <option>West Sussex</option>
                                                  <option>West Yorkshire</option>
                                                  <option>Wiltshire</option>
                                                  <option>Worcestershire</option>
                                             </select>
                                        </div>

                                        <div class="col-sm-6 col-md-4">
                                             <label for="postcode"
                                                  class="form-label">Postcode</label>
                                             <input id="postcode"
                                                  name="postcode"
                                                  type="text"
                                                  class="form-control"
                                                  autocomplete="postal-code"
                                                  required>
                                        </div>
                                   </div>

                                   <button type="submit"
                                        class="btn btn-warning w-100 mt-4">Register</button>

                                   <p class="text-center mt-3 mb-2">
                                        Have an account? <a href="{% url 'accounts:login' %}"
                                             class="text-decoration-none">Log in</a>
                                   </p>
                              </form>
                         </div>
                    </section>


               </div>



          </div>
     </div>
</main>

{% endblock %}
