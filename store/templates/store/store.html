{% extends 'base.html' %}
{% load static %}

{% block content %}

<!-- ========== Main content starts ========== -->

<main>

     <div class="bg-opacity-25 bg-warning py-4 pb-5">
          <div class="container">

               {% if 'search' in request.path %}
               <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3 mt-3">
                    <h1 class="h3 mb-0">Search Results</h1>
                    <!-- Search Results -->
                    {% else %}

                    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3 mt-3">
                         <h1 class="h3 mb-0">Our Store</h1>
                         <!-- Store -->
                         {% endif %}
                         
                    </div>

                    {% include 'store/includes/store_browser.html' %}
               </div>
          </div>

</main>

{% endblock content %}
