<!-- Sidebar navigation -->
<aside class="col-12 col-md-3"
     aria-label="Account navigation">
     <nav class="list-group">
          <a class="list-group-item list-group-item-action {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}"
               aria-current="page"
               href="{% url 'accounts:dashboard' %}">{{ user.full_name }}'s Dashboard</a>
          <a class="list-group-item list-group-item-action {% if request.resolver_match.url_name == 'my_orders' %}active{% endif %}"
               href="{% url 'accounts:my_orders' %}">My Orders</a>
          <a class="list-group-item list-group-item-action {% if request.resolver_match.url_name == 'edit_profile' %}active{% endif %}"
               href="{% url 'accounts:edit_profile' %}">Edit Profile</a>
          <a class="list-group-item list-group-item-action"
               href="#">Change Password</a>
          <a class="list-group-item list-group-item-action"
               href="#">Return and Refund</a>

     </nav>

     <form action="{% url 'accounts:logout' %}"
          method="post"
          class="mt-3">
          {% csrf_token %}
          <button type="submit"
               class="btn btn-secondary w-100">
               <i class="fa fa-power-off me-2"
                    aria-hidden="true"></i>
               <span>Log out</span>
          </button>
     </form>
</aside>
