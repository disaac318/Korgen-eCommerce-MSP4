{% if messages %}
<div class="message-container container mt-3" id="message">
     {% for message in messages %}
     <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show alert-flash"
          role="alert">
          {{ message }}
          <button type="button"
               class="btn-close"
               data-bs-dismiss="alert"
               aria-label="Close"></button>
     </div>
     {% endfor %}
</div>
{% endif %}
