{% if messages %}
<div class="message-region bg-opacity-25 bg-warning">
     <div class="message-container  container py-3" id="message">
          {% for message in messages %}
          <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show alert-flash"
               role="alert">
               {{ message }}
               <button type="button"
                    class="btn-close"
                    data-bs-dismiss="alert"
                    aria-label="Close"></button>
          </div>
          {% endfor %}
     </div>
</div>
{% endif %}
